<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giọng dịch Nestor</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:#101114;color:#eef0f6;font:14px/1.6 system-ui,sans-serif}main{max-width:440px;margin:auto}h1{font-size:18px;margin:0 0 6px}p{color:#a5a9b5;margin:6px 0 18px}audio{width:100%}.badge{display:inline-block;color:#8eb5ff;background:#172237;border:1px solid #2a3e60;border-radius:20px;padding:4px 10px;font-size:11px}small{display:block;margin-top:16px;color:#828897}
</style>
</head>
<body><main>
<span class="badge">Đầu ra âm thanh riêng</span><h1>Giọng dịch Nestor</h1>
<p id="state" role="status">Đã sẵn sàng. Quay lại trang video và bắt đầu phiên dịch.</p>
<audio id="translation-output" controls></audio>
<small>Giữ cửa sổ này mở để nghe giọng dịch. Bạn có thể thu nhỏ nó. Khi chia sẻ âm thanh, chọn tab video Nestor; không chọn cửa sổ này hoặc toàn màn hình.</small>
</main>
<script>
const audio=document.getElementById('translation-output');
const status=document.getElementById('state');
audio.addEventListener('play',()=>{status.textContent='Đang phát bản dịch…'});
audio.addEventListener('ended',()=>{status.textContent='Đang chờ bản dịch tiếp theo…'});
audio.addEventListener('pause',()=>{if(!audio.ended && audio.currentSrc)status.textContent='Đã tạm dừng. Nhấn Phát để nghe tiếp.'});
audio.addEventListener('loadeddata',()=>{if(audio.paused)status.textContent='Nếu chưa nghe được, nhấn Phát trên thanh âm thanh.'});
</script></body></html>
