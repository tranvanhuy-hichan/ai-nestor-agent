[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nestor-agent"
version = "0.6.2"
description = "Nestor Agent: personal AI agent gateway with web UI, CLI, skills, MCP and Telegram"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "tranvanhuy-hichan"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "gTTS>=2.5.4,<3",
  "pyyaml>=6",
  "croniter>=2",
  "mcp>=2,<3",
  "pypdf>=4",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "cryptography>=42",
  "playwright>=1.45",
  "numpy>=1.26",
  "psutil>=6",
  "prompt_toolkit>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
keyring = ["keyring>=24"]  # luu khoa chu vao keychain cua he dieu hanh

[project.scripts]
nestor = "nestor.cli:main"

[tool.setuptools.packages.find]
include = ["nestor*"]

[tool.setuptools.package-data]
"nestor" = ["cv_templates/*.mjs"]
"nestor.services.vanban" = ["references/*.json"]
"nestor.bundled_skills" = ["**/*", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
